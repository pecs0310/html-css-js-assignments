<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 암호화폐 가격 변동 추적기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>실시간 암호화폐 가격 변동 추적기</h1>

    <div class="tabs">
      <button class="tab active" data-tab="all">전체보기</button>
      <button class="tab" data-tab="favorites">관심항목</button>
    </div>

    <input type="text" id="search" placeholder="심볼 검색 (예: BTCUSDT)">

    <table>
      <thead>
        <tr>
          <th class="col-star">관심</th>
          <th>심볼</th>
          <th>현재가</th>
          <th>24시간 변동률</th>
          <th>최고가</th>
          <th>최저가</th>
        </tr>
      </thead>
      <tbody id="tickerBody"></tbody>
    </table>
  </main>

  <script src="tracker.js"></script>
</body>
</html>
